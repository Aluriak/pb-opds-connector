# Checks and builds the app on every push. The "OPDS Connector.app" files of both
# platforms can be downloaded from the job page, under "Job artifacts".

variables:
  ZIG_VERSION: "0.17.0"
  # Keeps the downloaded dependencies (zig-xml) between pipelines
  ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"

default:
  image: debian:trixie-slim
  cache:
    key: "zig-$ZIG_VERSION"
    paths:
      - .zig-global-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils make zip > /dev/null
    - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-$(uname -m)-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
    - mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
    - ln -sf /opt/zig/zig /usr/local/bin/zig
    - zig version

stages:
  - check
  - build

check:
  stage: check
  script:
    - make fmt-check
    - make test

build:
  stage: build
  script:
    - make build-all
    # One archive per platform, same layout as the releases
    - |
      for dir in zig-out/*/bin; do
        platform="$(basename "$(dirname "$dir")")"
        (cd "$dir" && zip -9 "$CI_PROJECT_DIR/opds-connector-${CI_COMMIT_SHORT_SHA}-${platform}.zip" "OPDS Connector.app")
      done
  artifacts:
    name: "opds-connector-$CI_COMMIT_SHORT_SHA"
    paths:
      - opds-connector-*.zip
    expire_in: 1 month
