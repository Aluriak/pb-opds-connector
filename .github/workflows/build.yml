# Checks and builds the app on every push. Each push to main replaces the "nightly"
# release, so the latest build is always at the same address:
# https://github.com/<owner>/<repo>/releases/download/nightly/opds-connector-<platform>.zip
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0
  # Keeps the downloaded dependencies (zig-xml) between runs
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

permissions:
  contents: write

# Two pushes in a row must not replace the nightly release at the same time
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Cache Zig dependencies
        uses: actions/cache@v4
        with:
          path: .zig-global-cache
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-$(uname -m)-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Format
        run: make fmt-check

      - name: Tests
        run: make test

      - name: Decide the kind of build
        run: |
          # The app compares these with what is published when it looks for an update
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            channel=release; tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            channel=nightly; tag=nightly
          else
            channel=dev; tag=
          fi
          version="$(sed -n 's/^ *\.version = "\(.*\)",.*/\1/p' build.zig.zon)"
          {
            echo "CHANNEL=$channel"
            echo "RELEASE_TAG=$tag"
            echo "APP_VERSION=$version"
            echo "ZIGFLAGS=-Dchannel=$channel -Dcommit=$GITHUB_SHA -Dupdate-repo=$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"

      - name: Check that a release tag matches the version
        if: env.CHANNEL == 'release'
        run: |
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match version $APP_VERSION in build.zig.zon"
            exit 1
          fi

      - name: Build
        run: make build-all ZIGFLAGS="$ZIGFLAGS"

      - name: Build for debugging
        run: |
          # Debug builds write a log, see "Debugging" in the README
          for platform in allwinner rk3566; do
            zig build -Dplatform=$platform --prefix zig-out/debug-$platform
            mv "zig-out/debug-$platform/bin/OPDS Connector.app" "zig-out/debug-$platform/bin/OPDS Connector.bin"
            cp scripts/opds-debug.app zig-out/debug-$platform/bin/
          done

      - name: Package
        run: |
          mkdir -p dist
          for platform in allwinner rk3566; do
            (cd zig-out/$platform/bin && zip -9 "$GITHUB_WORKSPACE/dist/opds-connector-$platform.zip" "OPDS Connector.app")
            (cd zig-out/debug-$platform/bin && zip -9 "$GITHUB_WORKSPACE/dist/opds-connector-$platform-debug.zip" "OPDS Connector.bin" opds-debug.app)
            # Unzipped, for the app to update itself
            cp "zig-out/$platform/bin/OPDS Connector.app" "dist/opds-connector-$platform.app"
          done
          {
            echo "channel=$CHANNEL"
            echo "version=$APP_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "tag=$RELEASE_TAG"
            echo "date=$(date -u +%Y-%m-%d)"
          } > dist/version.txt
          cat dist/version.txt
          ls -la dist

      - name: Keep the files of this run
        uses: actions/upload-artifact@v4
        with:
          name: opds-connector-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish as nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Latest build of main, commit ${GITHUB_SHA::7}. Unzip and copy \`OPDS Connector.app\` into the \`applications\` folder of your PocketBook."

      - name: Publish the release
        if: env.CHANNEL == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Version ${APP_VERSION}. Unzip and copy \`OPDS Connector.app\` into the \`applications\` folder of your PocketBook, or use \"Check for updates\" in the app."
